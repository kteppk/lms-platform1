<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LMS Platform - Вход</title>
  <script src="https://www.gstatic.com/firebasejs/12.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.10.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js?v=mobile1"></script>
  <link rel="stylesheet" href="portal.css?v=community1">
  <link rel="stylesheet" href="mobile-nav.css?v=mobile1">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="eyebrow">КТЭиП ПК · Учебная платформа</div><h1>Добро пожаловать</h1>
    <p class="subtitle">Войдите, чтобы продолжить учёбу и работу</p>
    
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login', this)">Вход</button>
      <button class="tab" onclick="switchTab('register', this)">Регистрация</button>
    </div>

    <div id="error" class="error hidden"></div>

    <!-- Форма входа -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="form-group">
        <label for="loginPassword">Пароль</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit" class="submit">Войти</button>
    </form>

    <!-- Форма регистрации -->
    <form id="registerForm" class="hidden" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="regName">Имя, фамилия и отчество</label>
        <input type="text" id="regName" required maxlength="120" autocomplete="name" placeholder="Иван Иванов Иванович" aria-describedby="nameHint">
        <small id="nameHint">Пишите настоящее ФИО полностью, без никнейма. Если отчества нет, это можно отметить в профиле.</small>
      </div>
      <div class="form-group">
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" required>
      </div>
      <div class="form-group">
        <label for="regPassword">Пароль (мин. 6 символов)</label>
        <input type="password" id="regPassword" required minlength="6">
      </div>
      <button type="submit" class="submit">Зарегистрироваться</button>
    </form>
  </div>

  <script>
    let handlingForm = false;

    function switchTab(tab, button) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      button.classList.add('active');
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
      document.getElementById('error').classList.add('hidden');
    }

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    async function openCabinet(account, name) {
      const profile = await getProfile(account, name);
      location.replace(cabinetPage(profile.role));
    }

    async function handleAuthForm(event, action) {
      event.preventDefault();
      if (handlingForm) return;
      handlingForm = true;
      const button = event.currentTarget.querySelector('button[type="submit"]');
      button.disabled = true;
      document.getElementById('error').classList.add('hidden');
      try {
        await action();
      } catch (error) {
        showError(error.code === 'auth/email-already-in-use'
          ? 'Этот аккаунт уже существует. Войдите с тем же email и паролем.'
          : error.message);
      } finally {
        button.disabled = false;
        handlingForm = false;
      }
    }

    function handleLogin(event) {
      return handleAuthForm(event, async () => {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const { user } = await auth.signInWithEmailAndPassword(email, password);
        await openCabinet(user);
      });
    }

    function handleRegister(event) {
      return handleAuthForm(event, async () => {
        const name = document.getElementById('regName').value.trim();
        if (!name) throw new Error('Укажите имя, фамилию и отчество.');
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        const { user } = await auth.createUserWithEmailAndPassword(email, password);
        await user.updateProfile({ displayName: name });
        await openCabinet(user, name);
      });
    }

    auth.onAuthStateChanged(account => {
      if (account && !handlingForm) openCabinet(account).catch(error => showError(error.message));
    });
  </script>
</body>
</html>
