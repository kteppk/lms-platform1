<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Кабинет преподавателя</title>
  <script src="https://www.gstatic.com/firebasejs/12.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.10.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js?v=mobile1"></script>
  <script src="gradebook.js?v=assessment1"></script>
  <script src="mobile-nav.js?v=mobile1" defer></script>
  <script src="portal.js?v=mobile1" defer></script>
  <link rel="stylesheet" href="assessment.css">
  <link rel="stylesheet" href="subjects.css">
  <link rel="stylesheet" href="portal.css?v=community1">
  <link rel="stylesheet" href="mobile-nav.css?v=mobile1">
</head>
<body>
  <header>
    <h1>Учебная платформа<span class="brand-caption">КТЭиП ПК · Кабинет преподавателя</span></h1>
    <div class="user-info">
      <button class="profile-link" type="button" onclick="Portal.navigate('profile')"><span id="userName"></span></button>
      <button class="logout" onclick="logout()">Выйти</button>
    </div>
  </header>

  <p id="status" role="alert" hidden style="padding:12px 24px;color:#c53030"></p>
  <main hidden>
    <nav class="tabs" aria-label="Основная навигация">
      <span class="nav-label">Рабочее пространство</span>
      <button class="tab-btn active" data-tab="home" onclick="switchTab('home',this)">Главная</button>
      <button class="tab-btn" data-tab="subjects" onclick="switchTab('subjects', this)">Предметы</button>
      <button class="tab-btn" id="lecturesTab" data-tab="lectures" onclick="switchTab('lectures', this)">Лекции</button>
      <button class="tab-btn" data-tab="books" onclick="switchTab('books', this)">Книги</button>
      <button class="tab-btn" data-tab="tests" onclick="switchTab('tests', this)">Тесты</button>
      <button class="tab-btn" data-tab="students" onclick="switchTab('students', this)">Студенты</button>
      <button class="tab-btn" data-tab="journal" onclick="switchTab('journal', this)">Журнал оценок</button>
      <span class="nav-label">Информация</span><button class="tab-btn" data-tab="teachers" onclick="switchTab('teachers',this)">Преподаватели</button>
<button class="tab-btn" data-tab="schedule" onclick="switchTab('schedule',this)">Расписание</button>
<button class="tab-btn" data-tab="notifications" onclick="switchTab('notifications',this)">Уведомления</button>
<button class="tab-btn" data-tab="profile" onclick="switchTab('profile',this)">Мой профиль</button>
    </nav>

    <div id="content" class="content"></div>
  </main>

  <script>
    let currentTab = 'home';
    let subjectCatalog = [];
    let selectedSubjectId = '';

    async function runAction(action) {
      showStatus('');
      try {
        await action();
      } catch (error) {
        showStatus(error.message);
      }
    }

    async function submitForm(event, action) {
      event.preventDefault();
      const button = event.currentTarget.querySelector('[type="submit"]');
      if (button.disabled) return;
      button.disabled = true;
      try {
        await runAction(action);
      } finally {
        button.disabled = false;
      }
    }

    function switchTab(tab, button) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(item => item.classList.toggle('active', item === button));
      runAction(render);
    }

    async function render() {
      const content = document.getElementById('content');

      if (await Portal.render(currentTab, content)) return;
      if (currentTab === 'journal') { await Gradebook.render(content, true); return; }

      if (currentTab === 'subjects') {
        await renderSubjects(content);
        return;
      }
      
      if (currentTab === 'lectures') {
        content.innerHTML = `
          <h2 style="margin-bottom:20px">Добавить лекцию</h2>
          <form onsubmit="submitForm(event, addLecture)">
            ${subjectPicker()}
            <div class="form-group">
              <label>Название</label>
              <input type="text" id="lectureTitle" required>
            </div>
            <div class="form-group">
              <label for="lectureText">Текст лекции</label>
              <textarea id="lectureText" aria-describedby="lectureTextHint"></textarea>
              <small id="lectureTextHint">Для материала по предмету можно загрузить файл без текста.</small>
            </div>
            <div class="form-group">
              <label for="lectureFiles">Файлы (PDF, документы, презентации, MP4)</label>
              <input type="file" id="lectureFiles" multiple accept=".pdf,.doc,.docx,.ppt,.pptx,.mp4,.html">
            </div>
            <button type="submit" class="primary">Сохранить</button>
          </form>
          <hr style="margin:24px 0">
          <h2 style="margin-bottom:16px">Мои лекции</h2>
          <div id="lecturesList"></div>
        `;
        await loadLectures();
      }
      
      if (currentTab === 'books') {
        content.innerHTML = `
          <h2 style="margin-bottom:20px">Добавить книгу</h2>
          <form onsubmit="submitForm(event, addBook)">
            ${subjectPicker()}
            <div class="form-group">
              <label>Название</label>
              <input type="text" id="bookTitle" required>
            </div>
            <div class="form-group">
              <label>Автор</label>
              <input type="text" id="bookAuthor" required>
            </div>
            <div class="form-group">
              <label>Описание</label>
              <textarea id="bookDesc"></textarea>
            </div>
            <div class="form-group">
              <label>Файл книги (PDF)</label>
              <input type="file" id="bookFile" accept=".pdf">
            </div>
            <button type="submit" class="primary">Сохранить</button>
          </form>
          <hr style="margin:24px 0">
          <h2 style="margin-bottom:16px">Мои книги</h2>
          <div id="booksList"></div>
        `;
        await loadBooks();
      }
      
      if (currentTab === 'tests') {
        content.innerHTML = `
          <h2 style="margin-bottom:20px">Создать тест</h2>
          <form onsubmit="submitForm(event, createTest)">
            ${subjectPicker()}
            <div class="form-group">
              <label>Название теста</label>
              <input type="text" id="testTitle" maxlength="200" required>
            </div>
            <div class="form-group">
              <label>Таймер (минуты, 0 = без таймера)</label>
              <input type="number" id="testTimer" value="0" min="0" max="1440" required>
            </div>
            <div id="questionsContainer"></div>
            <button type="button" class="secondary" onclick="addQuestion()">+ Добавить вопрос</button>
            <button type="submit" class="primary">Сохранить тест</button>
          </form>
          <hr style="margin:24px 0">
          <h2 style="margin-bottom:16px">Мои тесты</h2>
          <div id="testsList"></div>
        `;
        addQuestion();
        await loadTests();
      }
      
      if (currentTab === 'students') {
        content.innerHTML = `<h2>Список студентов</h2><div id="studentsList"></div>`;
        await loadStudents();
      }
    }

    function subjectPicker() {
      return `<div class="form-group">
        <label for="materialSubject">Предмет</label>
        <select id="materialSubject" onchange="selectedSubjectId = this.value">
          <option value="">Без предмета</option>
          ${subjectCatalog.filter(subject => subject.joined).map(subject => `
            <option value="${escapeHtml(subject.id)}" ${subject.id === selectedSubjectId ? 'selected' : ''}>
              ${escapeHtml(subject.title)}
            </option>`).join('')}
        </select>
      </div>`;
    }

    async function loadSubjectOptions() {
      const select = document.getElementById('materialSubject');
      const subjects = await callFunction('listSubjects');
      if (!select.isConnected) return;
      subjectCatalog = subjects;
      const available = subjects.filter(subject => subject.joined);
      select.replaceChildren(new Option('Без предмета', ''),
        ...available.map(subject => new Option(subject.title, subject.id)));
      select.value = available.some(subject => subject.id === selectedSubjectId) ? selectedSubjectId : '';
      selectedSubjectId = select.value;
    }

    function subjectLabel(subjectId) {
      if (!subjectId) return '';
      const title = subjectCatalog.find(subject => subject.id === subjectId)?.title || 'Предмет недоступен';
      return `<div class="meta">${escapeHtml(title)}</div>`;
    }

    async function renderSubjects(content) {
      content.innerHTML = `
        <h2 id="subjectFormTitle" style="margin-bottom:20px">Добавить предмет</h2>
        <form id="subjectForm" onsubmit="submitForm(event, saveSubject)">
          <div class="form-group">
            <label for="subjectTitle">Название предмета</label>
            <input id="subjectTitle" required maxlength="120">
          </div>
          <div class="form-group">
            <label for="subjectDescription">Описание</label>
            <textarea id="subjectDescription" maxlength="1000"></textarea>
          </div>
          <div class="subject-actions">
            <button type="submit" class="primary">Сохранить предмет</button>
            <button type="button" id="cancelSubjectEdit" class="secondary" hidden onclick="resetSubjectForm()">Отменить</button>
          </div>
        </form>
        <div id="teacherSubjects" class="subject-section">Загрузка…</div>`;
      const list = document.getElementById('teacherSubjects');
      const subjects = await callFunction('listSubjects');
      if (!list.isConnected) return;
      subjectCatalog = subjects;
      const mine = subjects.filter(subject => subject.joined || subject.canEdit);
      const others = subjects.filter(subject => !subject.joined && !subject.canEdit);
      list.innerHTML = `
        <h2>Мои предметы</h2>
        <div class="subjects-grid">${mine.map(subjectCard).join('') || '<p>У вас пока нет предметов.</p>'}</div>
        <section class="subject-section">
          <h2>Другие предметы</h2>
          <div class="subjects-grid">${others.map(subjectCard).join('') || '<p>Других предметов пока нет.</p>'}</div>
        </section>`;
    }

    function subjectCard(subject) {
      const id = escapeHtml(subject.id);
      return `<article class="item subject-card">
        <h3>${escapeHtml(subject.title)}</h3>
        <p class="subject-description">${escapeHtml(subject.description)}</p>
        <p class="meta">Преподавателей: ${escapeHtml(subject.teacherCount)}</p>
        <div class="subject-actions">
          ${subject.joined ? `
            <button class="primary" data-id="${id}" onclick="openSubjectPublication(this)">Добавить материал</button>
            <button class="secondary" data-id="${id}" onclick="changeSubject(this, 'leaveSubject')">Перестать вести</button>
          ` : `<button class="primary" data-id="${id}" onclick="changeSubject(this, 'joinSubject')">Присоединиться</button>`}
          ${subject.canEdit ? `
            <button class="secondary" data-id="${id}" onclick="editSubject(this)">Редактировать</button>
            <button class="secondary" data-id="${id}" onclick="changeSubject(this, 'deleteSubject')">Удалить предмет</button>
          ` : ''}
        </div>
      </article>`;
    }

    async function saveSubject() {
      await callFunction('saveSubject', {
        subjectId: document.getElementById('subjectForm').dataset.id,
        title: document.getElementById('subjectTitle').value,
        description: document.getElementById('subjectDescription').value
      });
      if (currentTab === 'subjects') await render();
    }

    function editSubject(button) {
      const subject = subjectCatalog.find(item => item.id === button.dataset.id);
      if (!subject) return;
      document.getElementById('subjectForm').dataset.id = subject.id;
      document.getElementById('subjectFormTitle').textContent = 'Редактировать предмет';
      document.getElementById('subjectDescription').value = subject.description;
      document.getElementById('cancelSubjectEdit').hidden = false;
      const title = document.getElementById('subjectTitle');
      title.value = subject.title;
      title.focus();
    }

    function resetSubjectForm() {
      const form = document.getElementById('subjectForm');
      delete form.dataset.id;
      form.reset();
      document.getElementById('subjectFormTitle').textContent = 'Добавить предмет';
      document.getElementById('cancelSubjectEdit').hidden = true;
    }

    async function changeSubject(button, action) {
      const messages = {
        leaveSubject: 'Перестать вести предмет? Ваши материалы по нему скроются для студентов.',
        deleteSubject: 'Удалить предмет из каталога? Материалы и результаты сохранятся в базе.'
      };
      if (messages[action] && !confirm(messages[action])) return;
      button.disabled = true;
      try {
        await runAction(async () => {
          await callFunction(action, { subjectId: button.dataset.id });
          if (currentTab === 'subjects') await render();
        });
      } finally {
        button.disabled = false;
      }
    }

    function openSubjectPublication(button) {
      selectedSubjectId = button.dataset.id;
      switchTab('lectures', document.getElementById('lecturesTab'));
    }

    function addQuestion() {
      const container = document.getElementById('questionsContainer');
      const idx = container.children.length;
      const div = document.createElement('div');
      div.className = 'question-block';
      div.innerHTML = `
        <h4>Вопрос ${idx + 1}</h4>
        <div class="form-group">
          <label>Текст вопроса</label>
          <input type="text" class="q-text" maxlength="2000" required>
        </div>
        <div class="form-group">
          <label>Тип ответа</label>
          <select class="q-type" onchange="toggleAnswerType(this)">
            <option value="choice">Варианты ответа</option>
            <option value="text">Текстовый ответ</option>
            <option value="photo">Фото-ответ</option>
          </select>
        </div>
        <div class="q-options">
          <div class="form-group">
            <label>Вариант 1</label>
            <input type="text" class="q-opt" maxlength="500" required>
          </div>
          <div class="form-group">
            <label>Вариант 2</label>
            <input type="text" class="q-opt" maxlength="500" required>
          </div>
          <div class="form-group">
            <label>Вариант 3</label>
            <input type="text" class="q-opt" maxlength="500" required>
          </div>
          <div class="form-group">
            <label>Вариант 4</label>
            <input type="text" class="q-opt" maxlength="500" required>
          </div>
          <div class="form-group">
            <label>Правильный вариант (1-4)</label>
            <input type="number" class="q-correct" min="1" max="4" value="1" required>
          </div>
        </div>
      `;
      container.appendChild(div);
    }

    function toggleAnswerType(select) {
      const block = select.closest('.question-block');
      const optionsDiv = block.querySelector('.q-options');
      const choice = select.value === 'choice';
      optionsDiv.classList.toggle('hidden', !choice);
      optionsDiv.querySelectorAll('input').forEach(input => { input.disabled = !choice; });
    }

    async function saveMaterial(kind, fields, files) {
      if (files.length > 20) throw new Error('Добавьте не более 20 вложений.');
      const subjectId = document.getElementById('materialSubject').value || null;
      const uploaded = [];
      for (const file of files) uploaded.push(await uploadAttachment(kind, file, { subjectId }));
      await callFunction('createMaterial', {
        kind, ...fields, subjectId, files: uploaded, fileNames: Array.from(files, file => file.name)
      });
      await render();
    }

    async function addLecture() {
      const title = document.getElementById('lectureTitle').value;
      const text = document.getElementById('lectureText').value;
      const files = document.getElementById('lectureFiles').files;
      if (!text.trim() && (!document.getElementById('materialSubject').value || !files.length)) {
        throw new Error('Введите текст лекции или выберите предмет и прикрепите файл.');
      }
      
      await saveMaterial('lectures', { title, text }, files);
    }

    async function loadLectures() {
      const list = document.getElementById('lecturesList');
      const [lectures] = await Promise.all([
        callFunction('listMaterials', { kind: 'lectures', mine: true }), loadSubjectOptions()
      ]);
      list.innerHTML = lectures.map(data => {
        return `<div class="item">
          <h3>${escapeHtml(data.title)}</h3>
          <div class="meta">${new Date(data.createdAt).toLocaleString('ru')}</div>
          ${subjectLabel(data.subjectId)}
          <p>${escapeHtml(data.text?.substring(0, 100))}...</p>
          ${data.files?.length ? `<p style="margin-top:8px">📎 Файлов: ${data.files.length}</p>` : ''}
          <div class="item-actions">
            <button class="secondary" data-id="${escapeHtml(data.id)}" onclick="deleteItem('lectures', this.dataset.id, 'Удалить лекцию?')">Удалить</button>
          </div>
        </div>`;
      }).join('') || '<p>Нет лекций</p>';
    }

    function deleteItem(collection, id, message) {
      if (!confirm(message)) return;
      return runAction(async () => {
        await callFunction('deleteItem', { kind: collection, id });
        await render();
      });
    }

    async function addBook() {
      const title = document.getElementById('bookTitle').value;
      const author = document.getElementById('bookAuthor').value;
      const desc = document.getElementById('bookDesc').value;
      const file = document.getElementById('bookFile').files[0];
      
      await saveMaterial('books', { title, author, description: desc }, file ? [file] : []);
    }

    async function loadBooks() {
      const list = document.getElementById('booksList');
      const [books] = await Promise.all([
        callFunction('listMaterials', { kind: 'books', mine: true }), loadSubjectOptions()
      ]);
      list.innerHTML = books.map(data => {
        return `<div class="item">
          <h3>${escapeHtml(data.title)}</h3>
          <div class="meta">${escapeHtml(data.author)}</div>
          ${subjectLabel(data.subjectId)}
          <p>${escapeHtml(data.description)}</p>
          <div class="item-actions">
            <button class="secondary" data-id="${escapeHtml(data.id)}" onclick="deleteItem('books', this.dataset.id, 'Удалить книгу?')">Удалить</button>
          </div>
        </div>`;
      }).join('') || '<p>Нет книг</p>';
    }

    async function createTest() {
      const title = document.getElementById('testTitle').value;
      const timer = parseInt(document.getElementById('testTimer').value);
      
      const questions = [...document.querySelectorAll('.question-block')].map(block => {
        const type = block.querySelector('.q-type').value;
        const q = {
          text: block.querySelector('.q-text').value,
          type: type
        };
        
        if (type === 'choice') {
          q.options = [...block.querySelectorAll('.q-opt')].map(i => i.value);
          q.correct = parseInt(block.querySelector('.q-correct').value) - 1;
        }
        
        return q;
      });
      
      const subjectId = document.getElementById('materialSubject').value || null;
      await callFunction('createTest', { title, timer, questions, subjectId });
      await render();
    }

    async function loadTests() {
      const list = document.getElementById('testsList');
      const [tests] = await Promise.all([callFunction('listTeacherTests'), loadSubjectOptions()]);
      list.innerHTML = tests.map(data => {
        return `<div class="item">
          <h3>${escapeHtml(data.title)}</h3>
          <div class="meta">${data.questionCount} вопросов ${data.timer ? `• Таймер: ${escapeHtml(data.timer)} мин` : ''} ${data.archived ? '• В архиве' : ''}</div>
          ${subjectLabel(data.subjectId)}
          <div class="item-actions">
            ${data.archived ? '' : `<button class="secondary" data-id="${escapeHtml(data.id)}" onclick="deleteItem('tests', this.dataset.id, 'Убрать тест в архив? Начатые попытки и оценки сохранятся.')">В архив</button>`}
          </div>
        </div>`;
      }).join('') || '<p>Нет тестов</p>';
    }

    async function loadStudents() {
      const list = document.getElementById('studentsList');
      const students = await callFunction('listStudents');
      list.innerHTML = students.map(data => {
        return `<div class="item">
          <h3>${escapeHtml(data.name)}</h3>
          <div class="meta">${escapeHtml(data.email)}</div>
        </div>`;
      }).join('') || '<p>Нет студентов</p>';
    }

    watchCabinet('teacher', render);
  </script>
</body>
</html>
