<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Кабинет администратора · КТЭиП ПК</title>
  <script src="connection.js?v=0.7.5"></script>
  <script src="vendor/firebase/12.10.0/firebase-app-compat.js?v=0.7.5"></script>
  <script src="vendor/firebase/12.10.0/firebase-auth-compat.js?v=0.7.5"></script>
  <script src="firebase-config.js?v=0.7.5"></script>
  <script src="release.js?v=0.7.5"></script>
  <script src="action-menu.js?v=0.7.5" defer></script>
  <script src="news.js?v=0.7.5" defer></script>
  <script src="subject-search.js?v=0.7.5" defer></script>
  <script src="mobile-nav.js?v=0.7.5" defer></script>
  <script src="schedule.js?v=0.7.5" defer></script>
  <script src="subscriptions.js?v=0.7.5" defer></script>
  <script src="portal.js?v=0.7.5" defer></script>
  <link rel="stylesheet" href="portal.css?v=0.7.5">
  <link rel="stylesheet" href="mobile-nav.css?v=0.7.5">
  <link rel="stylesheet" href="schedule.css?v=0.7.5">
  <link rel="stylesheet" href="theme.css?v=0.7.5">
</head>
<body>
  <header>
    <h1><span class="brand-mark" aria-hidden="true">К</span><span>КТЭиП ПК<span class="brand-caption">Кабинет администратора · Кызыл</span></span></h1>
    <div class="user-info">
      <button class="profile-link" type="button" onclick="Portal.navigate('profile')"><span id="userName"></span></button>
      <button class="logout" onclick="logout()">Выйти</button>
    </div>
  </header>
  <p id="status" role="alert" hidden style="padding:12px 24px"></p>
  <main hidden>
    <nav class="tabs" aria-label="Основная навигация">
      <span class="nav-label">Управление</span>
      <button class="tab-btn active" data-tab="home" onclick="switchTab('home',this)">Главная</button>
      <button class="tab-btn" data-tab="accounts" onclick="switchTab('accounts',this)">Аккаунты и роли</button>
      <button class="tab-btn" data-tab="schedule" onclick="switchTab('schedule',this)">Расписание</button>
      <button class="tab-btn" data-tab="announcements" onclick="switchTab('announcements',this)">Новости и объявления</button>
      <span class="nav-label">Информация</span>
      <button class="tab-btn" data-tab="teachers" onclick="switchTab('teachers',this)">Преподаватели</button>
      <button class="tab-btn" data-tab="notifications" onclick="switchTab('notifications',this)">Уведомления</button>
      <button class="tab-btn" data-tab="profile" onclick="switchTab('profile',this)">Мой профиль</button>
      <small class="site-version" data-site-version>Версия 0.7.5</small>
    </nav>
    <div id="content" class="content"></div>
  </main>
  <script>
    let currentTab='home';
    function switchTab(tab,button){
      currentTab=tab;showStatus('');
      document.querySelectorAll('.tabs .tab-btn').forEach(b=>b.classList.toggle('active',b===button));
      Portal.render(tab,document.getElementById('content')).catch(e=>showStatus(e.message));
    }
    watchCabinet('admin',()=>Portal.render(currentTab,document.getElementById('content')));
  </script>
</body>
</html>
