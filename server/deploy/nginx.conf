log_format lms_safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
server {
 listen 80;
 server_name kteppk.ru www.kteppk.ru vm756327.vps.masterhost.tech;
 location ^~ /.well-known/acme-challenge/ { root /var/www/lms; try_files $uri =404; }
 location / { return 308 https://kteppk.ru$request_uri; }
}
server {
 listen 443 ssl;
 http2 on;
 server_name kteppk.ru;
 ssl_certificate /etc/letsencrypt/live/kteppk.ru/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/kteppk.ru/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 root /var/www/lms;
 index index.html;
 access_log /var/log/nginx/lms.access.log lms_safe;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header X-Frame-Options SAMEORIGIN always;
 add_header Strict-Transport-Security 'max-age=86400' always;
 gzip on;
 gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;
 gzip_min_length 1024;
 location /auth/ { client_max_body_size 8k; include /etc/nginx/snippets/lms-proxy.conf; }
 location /functions/v1/ { client_max_body_size 1m; include /etc/nginx/snippets/lms-proxy.conf; }
 location /storage/v1/ { client_max_body_size 55m; include /etc/nginx/snippets/lms-proxy.conf; }
 location = /events { include /etc/nginx/snippets/lms-proxy.conf; proxy_cache off; gzip off; }
 location = /healthz { proxy_pass http://127.0.0.1:8080; }
 location ~ /\. { deny all; }
 location ~* \.mjs$ { types { } default_type application/javascript; add_header Cache-Control no-cache; try_files $uri =404; }
 location ~* \.(?:html|js|json|webmanifest)$ { add_header Cache-Control no-cache; try_files $uri =404; }
 location / { try_files $uri $uri/ =404; }
}
server {
 listen 443 ssl;
 http2 on;
 server_name www.kteppk.ru;
 ssl_certificate /etc/letsencrypt/live/kteppk.ru/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/kteppk.ru/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 return 308 https://kteppk.ru$request_uri;
}
server {
 listen 443 ssl;
 http2 on;
 server_name vm756327.vps.masterhost.tech;
 ssl_certificate /etc/letsencrypt/live/vm756327.vps.masterhost.tech/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/vm756327.vps.masterhost.tech/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 root /var/www/lms;
 # Workers cannot update through a redirect. Retire old offline shells in place.
 location = /sw.js { alias /var/www/lms/moved-sw.js; default_type application/javascript; add_header Cache-Control no-store always; }
 location = /lite/sw.js { alias /var/www/lms/moved-sw.js; default_type application/javascript; add_header Cache-Control no-store always; }
 location = /moved-sw.js { default_type application/javascript; add_header Cache-Control no-store always; }
 location / { return 308 https://kteppk.ru$request_uri; }
}
